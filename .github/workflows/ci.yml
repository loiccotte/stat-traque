# CI : compile, teste et MESURE l'app sous Windows (la seule plateforme de LoL).
# Échoue si un budget de performance de CLAUDE.md est dépassé.
name: ci
on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: rustup update stable && rustup default stable && rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (aucun avertissement toléré)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Compilation release
        run: cargo build --release
      - name: Budgets de performance
        shell: pwsh
        run: |
          # Pas de mise à jour automatique pendant la mesure (elle fausserait le CPU au repos).
          New-Item -ItemType Directory -Force "$env:APPDATA\stat-traque" | Out-Null
          "maj=non" | Set-Content "$env:APPDATA\stat-traque\reglages.txt"
          ./scripts/mesure.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: stat-traque-exe
          path: target/release/stat-traque.exe
